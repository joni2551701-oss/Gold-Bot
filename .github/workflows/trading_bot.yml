name: GoldBot Trading Pipeline

on:
  schedule:
    - cron: "*/5 3-18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: goldbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pin `main` explicitly so the scheduled/dispatch runner always
          # executes the production branch. As of TASK-CICD-001, `main`
          # is the single production branch and holds the real pipeline
          # (main.py -> core.pipeline.TradingPipeline, and every layer it
          # wires); it is also the repository's default branch, so this
          # pin matches the default -- it is kept explicit to make the
          # production branch unambiguous and consistent with
          # production_deploy.yml.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug Python imports
        run: |
          python --version
          python -c "import os; print(os.getcwd())"
          python -c "import decision; print(decision.__file__)"
          python -c "import decision.decision_engine; print('IMPORT OK')"

      - name: Verify runtime branch and entrypoint
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"

          if grep -q "from core.pipeline import TradingPipeline" main.py; then
            echo "OK: main.py imports TradingPipeline."
          else
            echo "FAIL: main.py does not import TradingPipeline (stale/skeleton entrypoint detected)."
            exit 1
          fi

          if grep -q "skeleton" main.py; then
            echo "FAIL: main.py still contains the old skeleton marker text."
            exit 1
          else
            echo "OK: no skeleton marker found in main.py."
          fi

      - name: Run GoldBot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py