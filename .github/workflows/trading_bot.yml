name: GoldBot Trading Pipeline

on:
  schedule:
    - cron: "*/5 3-18 * * 1-5"
  workflow_dispatch:

concurrency:
  group: goldbot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pin `main` explicitly so the scheduled/dispatch runner always
          # executes the production branch. As of TASK-CICD-001, `main`
          # is the single production branch and holds the real pipeline
          # (main.py -> core.pipeline.TradingPipeline, and every layer it
          # wires); it is also the repository's default branch, so this
          # pin matches the default -- it is kept explicit to make the
          # production branch unambiguous and consistent with
          # production_deploy.yml.
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug Python imports
        run: |
          python --version
          python -c "import os; print(os.getcwd())"
          python -c "import decision; print(decision.__file__)"
          python -c "import decision.decision_engine; print('IMPORT OK')"

      - name: Verify runtime branch and entrypoint
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git rev-parse --abbrev-ref HEAD)"

          if grep -q "from core.pipeline import TradingPipeline" main.py; then
            echo "OK: main.py imports TradingPipeline."
          else
            echo "FAIL: main.py does not import TradingPipeline (stale/skeleton entrypoint detected)."
            exit 1
          fi

          if grep -q "skeleton" main.py; then
            echo "FAIL: main.py still contains the old skeleton marker text."
            exit 1
          else
            echo "OK: no skeleton marker found in main.py."
          fi

      - name: Run GoldBot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # TASK-PROD-001: this runner's data/.cache_state.json (populated by
      # the fetch above) is the only place the live market cache exists --
      # this job runs on an ephemeral GitHub Actions runner, so it is lost
      # the moment the job ends. The VPS's goldbot.service (telegram/polling.py)
      # never fetches itself, so it needs this file to serve 📈 Current
      # Price. Publish it to the VPS's shared/data/ (same secrets pattern
      # as production_deploy.yml); release_deploy.sh symlinks each new
      # release's data/.cache_state.json to this shared file. Best-effort:
      # a missing file or an unreachable VPS must not fail the trading run
      # that already completed above.
      - name: Publish current-price cache to VPS
        if: always()
        continue-on-error: true
        run: |
          if [[ ! -f data/.cache_state.json ]]; then
            echo "No data/.cache_state.json produced this run -- skipping publish."
            exit 0
          fi
          if [[ -z "${{ secrets.VPS_HOST }}" ]]; then
            echo "VPS_HOST not configured -- skipping publish."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_deploy -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p '${{ secrets.DEPLOY_PATH }}/shared/data'"
          scp -i ~/.ssh/id_deploy -P "${{ secrets.VPS_PORT }}" \
            data/.cache_state.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/shared/data/.cache_state.json"