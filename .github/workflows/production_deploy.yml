name: GoldBot Production Deployment

# Phase P1 (Production Deployment Pipeline Foundation): validates and
# deploys GoldBot to the production VPS via a release-based,
# symlink-switched layout (/opt/goldbot/{releases,shared,current}).
# `deploy` only runs if `validate` succeeds -- every prior stage
# (checkout, Python setup, install, lint, compile, tests) must pass
# before anything reaches the VPS. Uses GitHub Secrets exclusively for
# VPS access (VPS_HOST/VPS_PORT/VPS_USER/VPS_SSH_KEY/DEPLOY_PATH) --
# no plaintext credential appears anywhere in this file.
#
# Deploy branch: main -- the single authoritative production branch.
# As of TASK-CICD-001 (CI/CD migration to main), both the automatic
# `push:` trigger and manual `workflow_dispatch` deploy `main`, so the
# auto and manual paths always ship the same branch. `main` holds the
# full production surface (telegram/polling.py, core/pipeline.py,
# main.py, scripts/deploy/) -- see docs/DEPLOYMENT.md and
# docs/deployment/PRODUCTION_DEPLOYMENT.md. If the production branch
# ever changes, update this `branches:` list and those two docs
# together.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pyflakes

      - name: Lint (pyflakes)
        run: python -m pyflakes $(git ls-files '*.py')

      - name: Compile check
        run: python -m compileall -q .

      - name: Run tests
        env:
          TELEGRAM_BOT_TOKEN: "123456789:AAFakeCITokenForPytestOnly0000000"
          TELEGRAM_CHAT_ID: "999999"
          TELEGRAM_OWNER_ID: "111"
          TWELVE_DATA_API_KEY: "unused"
          GEMINI_API_KEY: "unused"
        run: python -m pytest tests/ -q

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute release id
        id: release
        run: echo "id=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='database/*.db' \
            --exclude='.env' \
            --exclude='logs' \
            --exclude='venv' \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.DEPLOY_PATH }}/releases/${{ steps.release.outputs.id }}/"

      - name: Activate release
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash '${{ secrets.DEPLOY_PATH }}/releases/${{ steps.release.outputs.id }}/scripts/deploy/release_deploy.sh' '${{ secrets.DEPLOY_PATH }}' '${{ steps.release.outputs.id }}' goldbot"
