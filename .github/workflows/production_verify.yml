name: GoldBot Production Verify (temporary, read-only)

# TASK-OPS-001 -- temporary, READ-ONLY production VPS verification run
# from a GitHub Actions runner (the only environment that holds the VPS
# SSH credentials and API secrets). Manual dispatch only; it never
# deploys, restarts, or writes anything on the VPS -- every command is
# a status/read query. No secret VALUE is ever printed: the SSH secrets
# are consumed by the ssh-agent/keyscan actions, and the API
# connectivity probes are run inside the release venv, reading keys via
# the app's own core.secrets and printing only PASS/FAIL + HTTP status,
# never the key or the response body.
#
# Per DIRECTOR POLICY (Production Operations): this workflow is
# temporary and is removed once the verification has run.

on:
  workflow_dispatch:

concurrency:
  group: production-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Run read-only production diagnostics over SSH
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            bash -s -- "${{ secrets.DEPLOY_PATH }}" <<'REMOTE'
          set +e
          DP="$1"
          PY_BIN="$DP/current/venv/bin/python"
          [ -x "$PY_BIN" ] || PY_BIN="$(command -v python3)"

          echo "===== systemctl is-active ====="
          systemctl is-active goldbot.service

          echo "===== systemctl status (no secrets) ====="
          systemctl status goldbot.service --no-pager -n 20

          echo "===== journalctl (last 80 lines) ====="
          journalctl -u goldbot.service -n 80 --no-pager

          echo "===== current symlink ====="
          ls -l "$DP/current"
          echo "resolved: $(readlink -f "$DP/current")"

          echo "===== release history (last 20) ====="
          ls -1 "$DP/releases" 2>/dev/null | sort | tail -20

          echo "===== disk usage ====="
          df -h "$DP"

          echo "===== memory ====="
          free -m

          echo "===== cpu / load ====="
          uptime
          echo "cores: $(nproc)"

          echo "===== health_check.py (config/secrets-present/db/imports) ====="
          ( cd "$DP/current" && "$PY_BIN" scripts/health_check.py )
          echo "health_check exit: $?"

          echo "===== live connectivity (status only, no secrets) ====="
          ( cd "$DP/current" && "$PY_BIN" - <<'PY'
          import sys, urllib.request, urllib.error
          sys.path.insert(0, ".")

          def probe(name, url):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, method="GET"), timeout=15) as r:
                      print(f"{name}: PASS (HTTP {getattr(r, 'status', 200)})")
              except urllib.error.HTTPError as e:
                  print(f"{name}: REACHABLE (HTTP {e.code})")
              except Exception as e:
                  print(f"{name}: FAIL ({type(e).__name__})")

          try:
              from core.secrets import Secrets
              s = Secrets()
          except Exception as e:
              print(f"connectivity: SKIP secrets load ({type(e).__name__})")
              raise SystemExit(0)

          try:
              probe("telegram_getMe", f"https://api.telegram.org/bot{s.TELEGRAM_BOT_TOKEN}/getMe")
          except Exception as e:
              print(f"telegram_getMe: SKIP ({type(e).__name__})")

          try:
              probe("twelve_data", f"https://api.twelvedata.com/quote?symbol=XAU/USD&apikey={s.TWELVE_DATA_API_KEY}")
          except Exception as e:
              print(f"twelve_data: SKIP ({type(e).__name__})")

          try:
              gk = getattr(s, "GEMINI_API_KEY", None)
              if gk:
                  probe("gemini", f"https://generativelanguage.googleapis.com/v1beta/models?key={gk}")
              else:
                  print("gemini: SKIP (no key configured)")
          except Exception as e:
              print(f"gemini: SKIP ({type(e).__name__})")
          PY
          )

          echo "===== diagnostics complete ====="
          REMOTE
