name: GoldBot CI

# Validation-only pipeline (Phase 47.1): compiles, lints, and tests the
# repository on every push/PR. This is separate from trading_bot.yml,
# which is the scheduled production runner -- ci.yml never runs the
# real pipeline against live APIs and never needs production secrets.

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pyflakes pytest-cov

      - name: Compile check
        run: python -m compileall -q .

      - name: Lint (pyflakes)
        run: python -m pyflakes $(git ls-files '*.py')

      - name: Smoke import (every module in the repo)
        run: |
          python -c "
          import os, importlib, sys
          fails = []
          count = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith('.') and d != '__pycache__']
              for f in files:
                  if f.endswith('.py'):
                      rel = os.path.relpath(os.path.join(root, f), '.')
                      mod = rel[:-3].replace(os.sep, '.')
                      if mod.endswith('.__init__'):
                          mod = mod[:-9]
                      if mod.startswith('tests.'):
                          continue
                      count += 1
                      try:
                          importlib.import_module(mod)
                      except Exception as e:
                          fails.append((mod, str(e)))
          print(f'Modules checked: {count}')
          if fails:
              for mod, err in fails:
                  print(f'FAILED: {mod}: {err}')
              sys.exit(1)
          print('All modules imported successfully.')
          "

      - name: Run tests
        # TELEGRAM_OWNER_ID must match tests/conftest.py's default (111)
        # -- os.environ.setdefault() there is a no-op if this workflow
        # sets a different value first, which would silently break
        # every OWNER-permission test (discovered during Phase 47.1
        # validation).
        #
        # Coverage (Phase 52) is reported, not gated -- --cov-fail-under
        # is intentionally not set. See docs/testing_strategy.md for the
        # rationale and how to add a hard threshold in a future phase.
        env:
          TELEGRAM_BOT_TOKEN: "123456789:AAFakeCITokenForPytestOnly0000000"
          TELEGRAM_CHAT_ID: "999999"
          TELEGRAM_OWNER_ID: "111"
          TWELVE_DATA_API_KEY: "unused"
          GEMINI_API_KEY: "unused"
        run: python -m pytest tests/ -v --cov=. --cov-report=term-missing

  # Real Market Data Verification probe (Director Order REAL-DATA-002).
  # A SEPARATE job that runs ONLY on manual workflow_dispatch -- never on
  # push or pull_request, so normal CI validation is completely
  # unaffected (the `if:` gate makes this job skip on every automatic
  # run). It exercises the real production TwelveDataClient (XAU/USD)
  # with real GitHub Secrets, and a direct diagnostic call to Bitget's
  # PUBLIC BTC/USDT ticker (no auth). No secret value is ever printed --
  # see scripts/verification/real_market_data_probe.py for the security
  # contract. This job is report-only (exits 0 even when a provider is
  # BLOCKED); the real PASS/BLOCKED verdict is read from its log output,
  # so a BLOCKED environment issue is never mistaken for a hard failure.
  real_data_probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run real market data probe
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          BITGET_API_KEY: ${{ secrets.BITGET_API_KEY }}
          BITGET_API_SECRET: ${{ secrets.BITGET_API_SECRET }}
          BITGET_PASSPHRASE: ${{ secrets.BITGET_PASSPHRASE }}
        run: python scripts/verification/real_market_data_probe.py

      - name: Real pipeline runtime trace (main.py, real market data)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python main.py

      # Real continuous Price Stream probe (Director Order REAL-DATA-006).
      # A sibling gated step under the SAME workflow_dispatch-only job --
      # never runs on push/PR, never touches the `validate` job. Builds
      # the real production PriceStreamService (XAUUSD via TwelveData),
      # ticks it 3 times ~3s apart, and reports per-update provider price/
      # timestamp, validation outcome, MarketMemory read-back, and whether
      # PRICE_UPDATED fired. Report-only (exits 0); same security contract
      # as real_market_data_probe.py (presence flags / price / timestamp /
      # exception class only -- never an API key). See
      # scripts/verification/real_price_stream_probe.py.
      - name: Real continuous price stream probe (3 updates)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/verification/real_price_stream_probe.py
